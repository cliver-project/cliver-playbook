[project]
name = "cliver-playbook"
version = "0.2.1"
description = "Development workspace root for the cliver-playbook packages"
requires-python = ">=3.12"
# The workspace root is a development convenience, not a distributable
# package: `uv sync` here installs every backend package in editable mode
# (see [tool.uv.sources]) so the whole library is importable from a single
# virtualenv, exactly as a consuming project would install it.
# Package order mirrors the dependency chain:
# basic <- user <- rag <- rag-governance (and mcp on the same workspace).
dependencies = [
    "cliver-playbook-app-basic",
    "cliver-playbook-app-user",
    "cliver-playbook-app-rag",
    "cliver-playbook-app-rag-governance",
    "cliver-playbook-app-mcp",
]

[tool.uv]
package = false

[tool.uv.sources]
cliver-playbook-app-basic = { workspace = true }
cliver-playbook-app-user = { workspace = true }
cliver-playbook-app-rag = { workspace = true }
cliver-playbook-app-rag-governance = { workspace = true }
cliver-playbook-app-mcp = { workspace = true }

[tool.uv.workspace]
members = ["packages/backend/*"]
