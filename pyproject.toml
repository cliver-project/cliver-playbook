[project]
name = "mcp-x"
version = "0.1.0"
description = "A simple MCP server"
authors = [
    { name = "Lin Gao", email = "aoingl@gmail.com" }
]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "click>=8.2.1",
    "dotenv>=0.9.9",
    "fastapi>=0.116.1",
    "fastmcp>=2.10.5",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.2",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.0.270",
    "black>=25.1.0",
]

[project.scripts]
mcp_x = "mcp_x.app:main"

[build-system]
requires = ["uv_build>=0.7,<0.8"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "B", "I"]
