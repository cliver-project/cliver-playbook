# Application configuration — the lowest-priority settings layer.
#
# Precedence (highest first):
#   environment variables (CLIVER_*)  >  .env file  >  this file  >  field
#   defaults in packages/backend/cliver-playbook-app-basic/src/cliver_playbook/
#   app/basic/settings.py
#
# The application root is discovered by walking up from the current working
# directory until a directory containing app.yaml or .env is found — run any
# component from anywhere below this file and this configuration applies.
#
# Keys are BARE Settings field names (no CLIVER_ prefix — the prefix belongs
# to the environment-variable layer only). Structure authority is the
# Settings class; keys it does not define are silently ignored (extra=ignore),
# so a typo here fails quietly — check spelling against settings.py when a
# value seems to have no effect.
#
# Values may be Jinja2 expressions. The env(name, default=None) helper reads
# the process environment, then the discovered .env, then the default;
# omitting the default makes a variable REQUIRED (startup fails with its
# name). Wrap literal Jinja syntax in raw/endraw block tags.
#
# This file is checked in: NEVER put secrets here — keep them in the
# environment or the gitignored .env. Note: uvicorn --reload does not watch
# this file; restart after editing.

app_name: cliver-app
log_level: INFO

# Composed from CLIVER_DB_* parts (each defaulting to the bundled compose
# db), so a deployment can repoint the database either wholesale
# (CLIVER_DATABASE_URL — a higher layer, wins over this file) or part by
# part (CLIVER_DB_* — plain Jinja2 template inputs consumed below, not Settings
# fields). Quoted so special characters in a composed password stay valid
# YAML.
database_url: "postgresql://{{ env('CLIVER_DB_USER', 'cliver') }}:{{ env('CLIVER_DB_PASSWORD', 'cliver') }}@{{ env('CLIVER_DB_HOST', '127.0.0.1') }}:{{ env('CLIVER_DB_PORT', '5432') }}/{{ env('CLIVER_DB_NAME', 'cliver_app') }}"

# --- OIDC provider registry (identity domain, cliver-playbook-app-user) -----
#
# Bundled presets below, all disabled: enabling a provider is a deployment
# decision. Enable/override from the environment without editing this file,
# using nested env names, e.g.
#
#   CLIVER_OIDC__PROVIDERS__GOOGLE__ENABLED=true
#   CLIVER_OIDC__PROVIDERS__GOOGLE__CLIENT_ID=...
#   CLIVER_OIDC__PROVIDERS__GOOGLE__CLIENT_SECRET=...
#
# (the env layer beats this file; provider keys match case-insensitively).
# An enabled provider must carry client_id + client_secret plus either an
# issuer (discovery) or all three explicit endpoint URLs — validated at
# startup, fail fast. Client secrets NEVER go in this file (it is checked
# in) — env/.env only.
#
# Note: env can override values here but cannot REMOVE these presets (deep
# merge is additive); unwanted providers simply stay disabled. Deliberately
# absent: oauth21_issuer_url — empty, the provider derives `iss` per request
# from the incoming Host, and pinning it here would freeze that fallback.
oidc:
  # Absolute base URL of THIS backend as the IdP sees it, for the registered
  # redirect URI <base>/api/v1/auth/oauth/<key>/callback.
  # Empty -> derived from the incoming request.
  redirect_base: ""
  providers:
    google:
      enabled: false
      label: Google
      # Standard OIDC: the three endpoints come from the issuer's
      # /.well-known/openid-configuration document.
      issuer: https://accounts.google.com
      client_id: ""
      client_secret: ""
      scopes: openid profile email
      auto_provision: true
      default_role: user
    github:
      enabled: false
      label: GitHub
      # GitHub speaks plain OAuth2 with no discovery document: explicit
      # endpoints, and the numeric account id is the stable subject.
      authorize_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      userinfo_url: https://api.github.com/user
      subject_claim: id
      client_id: ""
      client_secret: ""
      scopes: read:user user:email
      auto_provision: true
      default_role: user

# --- RAG pipeline (knowledge base, cliver-playbook-app-rag) -----------------
#
# Every stage name resolves through its own registry; the web UI reads the
# live set from GET /api/v1/rag/stages and may override any of them per
# request. The values here are the process defaults.
#
# The dev reference pins the offline implementations: the stub embedder and
# the noop reranker need no model download, so the knowledge-base pages work
# on a fresh clone. Production stages are a deployment choice — override
# from the environment, e.g.
#
#   CLIVER_RAG__EMBEDDER=bge-base-zh-v1.5   # 768-d, ~400 MB, CPU-friendly
#   CLIVER_RAG__EMBEDDER=bge-m3             # 1024-d, ~2.3 GB, multilingual
#   CLIVER_RAG__RERANKER=bge-reranker-v2-m3
#
# The query embedder must match the model that indexed a document; vectors
# from different embedders are not comparable. The chat page exposes that
# choice per request.
rag:
  chunker: recursive
  embedder: stub
  retriever: pgvector-hybrid
  reranker: noop
  llm: stub

  # Default chunk sizing for every built-in chunker, used when an upload does
  # not override it. The effective size, overlap and chunker options are
  # recorded per document as chunker_config.
  chunk_size: 512
  chunk_overlap: 64

  # Retriever candidate count, then the reranker's context size for the
  # generator. score_floor applies only to rerankers that emit normalized
  # relevance scores; the noop reranker passes retriever scores through, so
  # the floor is skipped for it.
  top_k: 20
  rerank_top_k: 5
  score_floor: 0.2
  pgvector_ef_search: 40

  # Upload size cap. The endpoint rejects larger files before parsing
  # them, so a hostile upload cannot exhaust memory or the chunker.
  max_upload_bytes: 20971520
