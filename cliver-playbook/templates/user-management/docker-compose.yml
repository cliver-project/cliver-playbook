# Local PostgreSQL for development and tests. The application itself never
# runs in Docker during development — only this dependency service does.
services:
  db:
    image: postgres:16-alpine
    container_name: cliver_app_db
    environment:
      POSTGRES_USER: cliver
      POSTGRES_PASSWORD: cliver
      POSTGRES_DB: cliver_app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cliver_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliver -d cliver_app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cliver_db_data:
