<!doctype html>
<!--
  Copy of the basic package's dev shell index.html, which is in turn a copy of
  cliver-playbook-app-basic/tooling/index.html: the app needs its own copy, and
  an inline no-flash script cannot be imported. Keep the copies in sync.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cliver-app — user (dev shell)</title>
    <script>
      // Theme no-flash: resolve the persisted theme (or system preference)
      // before first paint. Must run before the bundle loads. The storage key
      // matches ThemeProvider ("cliver-theme") — keep them in sync.
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("cliver-theme") || "system";
          theme =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
              ? "dark"
              : "light";
        } catch (e) {
          /* localStorage unavailable — default light */
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
