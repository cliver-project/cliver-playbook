[project]
name = "cliver-playbook-app-rag"
version = "0.1.0"
description = "cliver-playbook knowledge base: pluggable RAG (chunker / embedder / retriever / reranker / LLM) over the identity stack"
requires-python = ">=3.12"
# Real dependency on the identity package (per ADR-0015). The RAG surface
# resolves agents/users/tokens through the same auth_tokens table the
# other packages use, so there is no separate rag_tokens table and no
# separate identity surface to audit.
dependencies = [
    "cliver-playbook-app-user",
    # Web framework. >=0.143 because router inclusion copies plain Starlette
    # routes (rebuilding them from route.endpoint) — the behaviour that
    # lets every RAG router reach the composed app the same way ADR-0017
    # pins for the MCP package.
    "fastapi>=0.143.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.16.0",
    "asyncpg>=0.30.0",
    # The migration runner is sync; psycopg is declared here so the
    # package's test environment and the operator's alembic invocation
    # both have it without transitively pulling basic+user.
    "psycopg[binary]>=3.2.0",
    "alembic>=1.16.0",
    "uvicorn>=0.31.1",
    # Pluggable chunker implementations. Recursive is the default;
    # markdown/code/pdf wrappers are pulled in by the same import.
    "langchain-text-splitters>=0.3.0",
    # DOCX chunker. python-docx reads the OOXML package directly; it
    # brings lxml with it, and its imports stay inside the chunker so
    # importing the chunking folder does not require it until used.
    "python-docx>=1.2,<2.0",
    # HTML chunker. BeautifulSoup's stdlib html.parser builder keeps
    # the dependency light (no lxml requirement) and handles charset
    # detection for byte input.
    "beautifulsoup4>=4.12",
    # Pluggable embedder + reranker: BGE-M3 (CPU-capable, dense+sparse+
    # ColBERT from one forward pass) and bge-reranker-v2-m3.
    "FlagEmbedding>=1.2.0",
    "sentence-transformers>=3.0.0",
    # Offline BM25-only retriever fallback (also useful in tests so a
    # SQLite test db can still answer search queries).
    "rank-bm25>=0.2.2",
    # PDF chunker: layout-aware partitioning. The package's default
    # PDF strategy is "fast" (no OCR); a future "hi_res" strategy can
    # flip to Tesseract-based extraction.
    "unstructured[pdf]>=0.16.0",
    # pgvector's SQLAlchemy Vector type for the rag_chunk_embeddings table.
    "pgvector>=0.3.0",
    # Optional hosted embedder (kept optional at the implementation
    # level: the StubEmbedder is the offline default; the OpenAI
    # embedder only matters when the operator sets CLIVER_RAG__OPENAI_API_KEY).
    "openai>=1.40.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.4.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The wheel ships this distribution's subtree of the shared
# `cliver_playbook.app` namespace. The `cliver_playbook/` and
# `cliver_playbook/app/` directories deliberately have NO __init__.py
# (PEP 420): every distribution contributes one portion and the import
# system merges them, which is also what lets editable installs of
# several cliver-playbook packages coexist in one virtualenv.
packages = ["src/cliver_playbook"]
# Editable installs (pip install -e) get a plain `_<dist>.pth` file
# adding `src/` to sys.path — the only editable mode that keeps the
# namespace merge working with sibling packages installed the same way.
# Never set dev-mode-exact: it requires __init__.py files and its
# finder would shadow the other packages' namespace portions.
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[tool.ruff.lint.isort]
# `cliver_playbook` is ONE namespace shared by several distributions:
# pin it as first-party in every package, or import grouping would
# depend on which subtree the current distribution happens to own
# (ruff otherwise classifies the sibling packages' modules as
# third-party).
known-first-party = ["cliver_playbook"]
