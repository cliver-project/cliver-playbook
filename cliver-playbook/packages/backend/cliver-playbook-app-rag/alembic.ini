# Alembic configuration for cliver-playbook-app-rag's own migration chain.
# Used for INTERACTIVE development (`alembic upgrade head` from this
# directory); the programmatic entry points in alembic/__init__.py build
# an equivalent config without an ini file, and both share alembic/env.py.
#
# The database URL is NOT set here — env.py resolves it from application
# settings so there is a single source of truth and zero secret
# duplication.
[alembic]
script_location = src/cliver_playbook/app/rag/alembic
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
