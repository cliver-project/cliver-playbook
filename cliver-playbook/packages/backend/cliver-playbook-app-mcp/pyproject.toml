[project]
name = "cliver-playbook-app-mcp"
version = "0.1.0"
description = "cliver-playbook agent surface: MCP server (streamable-http + stdio) on top of the identity stack"
requires-python = ">=3.12"
# A real dependency on the identity package (not a copied tree): the gate
# resolves agent tokens through its auth_tokens table, the tools call its
# services, and the protocol endpoint plugs into the same composed app. A
# standalone `pip install -e ../cliver-playbook-app-basic -e
# ../cliver-playbook-app-user` followed by `pip install -e .` satisfies the
# chain without redeclaring the dependencies it already brings (ADR-0015).
dependencies = [
    "cliver-playbook-app-user",
    # Web framework. The >=0.143 lower bound is load-bearing, not cosmetic:
    # router inclusion rebuilds plain Starlette routes out of an APIRouter by
    # copying `route.endpoint` — the behaviour that lets the protocol endpoint
    # be an ordinary route instead of a mounted sub-application (ADR-0017).
    "fastapi>=0.143.0",
    # Session AND the discovery endpoint's audit queries.
    "sqlalchemy>=2.0.36",
    # The MCP SDK: server (fastmcp-style MCPServer), streamable-http transport,
    # session manager, transport security. Upper bound: the lifecycle and router
    # behaviour this package builds on is version-sensitive.
    "mcp>=2.2.0,<3",
    # transport.run_http serves the application; also the main application's
    # serving entry point.
    "uvicorn>=0.31.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.4.0",
    "ruff>=0.8.0",
    # The suite rehearses the composed path: conftest creates a temp database
    # over the sync driver and applies the dependency packages' migration
    # chains in process. Both arrive transitively with cliver-playbook-app-user;
    # declared here so this package's test environment is stated, not inferred.
    "psycopg[binary]>=3.2.0",
    "alembic>=1.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The wheel ships this distribution's subtree of the shared
# `cliver_playbook.app` namespace. The `cliver_playbook/` and
# `cliver_playbook/app/` directories deliberately have NO __init__.py
# (PEP 420): every distribution contributes one portion and the import
# system merges them, which is also what lets editable installs of several
# cliver-playbook packages coexist in one virtualenv.
packages = ["src/cliver_playbook"]
# Editable installs (pip install -e) get a plain `_<dist>.pth` file adding
# `src/` to sys.path — the only editable mode that keeps the namespace merge
# working with sibling packages installed the same way. Never set
# dev-mode-exact: it requires __init__.py files and its finder would shadow
# the other packages' namespace portions.
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
# No pythonpath tricks: the tests import the *installed* package, so a broken
# install fails the suite instead of being masked by the source tree.
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework idiom.
ignore = ["B008"]

[tool.ruff.lint.isort]
# `cliver_playbook` is ONE namespace shared by several distributions: pin it
# as first-party in every package, or import grouping would depend on which
# subtree the current distribution happens to own (ruff otherwise classifies
# the sibling packages' modules as third-party).
known-first-party = ["cliver_playbook"]
