paths:
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "409":
          description: Username or email already in use
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Sign in with username and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Return the current user
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Invalid or expired token
  /api/v1/auth/profile:
    patch:
      tags: [auth]
      summary: Update the current user's profile
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
components:
  schemas:
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 64
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        password:
          type: string
          minLength: 8
          maxLength: 128
        email:
          type: [string, "null"]
          format: email
        display_name:
          type: string
          maxLength: 128
          default: ""
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
    LoginResponse:
      type: object
      required: [token, must_change_password, user]
      properties:
        token:
          type: string
        must_change_password:
          type: boolean
        user:
          $ref: "#/components/schemas/UserRead"
    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/UserRead"
    ProfileUpdate:
      type: object
      properties:
        email:
          type: [string, "null"]
          format: email
        phone:
          type: [string, "null"]
          maxLength: 32
        display_name:
          type: string
          minLength: 1
          maxLength: 128
    UserRead:
      type: object
      required:
        [id, username, display_name, is_active, must_change_password, created_at]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        display_name:
          type: string
        is_active:
          type: boolean
        must_change_password:
          type: boolean
        created_at:
          type: string
          format: date-time
        role_codes:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
