name: Release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: make init
      - run: make check
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            services/api/dist
            apps/web/dist
          if-no-files-found: warn
