# Local PostgreSQL for development and tests. The application itself never runs
# in Docker during development — only this dependency service does. A consuming
# project copies this file unchanged: the defaults here are the defaults in
# app.yaml, so `make db-up` is the whole setup.
#
# The image is the official pgvector build of the same PostgreSQL major
# version: the RAG package's migration runs CREATE EXTENSION vector, and stock
# postgres images do not ship the extension. The pgvector image is a drop-in
# replacement, so an existing named volume keeps its data when the container
# is recreated against it.
# Pinned so the project (and its data volume) keeps the same name regardless of
# the checkout directory, including after the repository was renamed.
name: cliver-playbook

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cliver_app_db
    environment:
      POSTGRES_USER: cliver
      POSTGRES_PASSWORD: cliver
      POSTGRES_DB: cliver_app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cliver_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliver -d cliver_app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cliver_db_data:
