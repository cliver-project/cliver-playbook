[project]
name = "cliver-playbook-app-user"
version = "0.1.0"
description = "cliver-playbook identity: accounts, RBAC, OIDC login, OAuth 2.1 provider for agent clients"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Lin Gao" }]
requires-python = ">=3.12"
# A real dependency on the foundations package (not a copied tree): the whole
# point of the packaging model is that user imports basic at runtime, so a
# standalone `pip install -e ../cliver-playbook-app-basic` followed by
# `pip install -e .` satisfies it without redeclaring basic's requirements
# (ADR-0015).
dependencies = [
    "cliver-playbook-app-basic==0.1.0",
    # Web framework and server
    "fastapi>=0.143.0",
    # Async ORM in services/routes; Alembic drives the sync psycopg URL that
    # basic's settings derive from the same CLIVER_DATABASE_URL.
    "sqlalchemy>=2.0.36",
    "alembic>=1.16.0",
    # conftest.py creates/drops the temp database over the sync driver.
    "psycopg[binary]>=3.2.0",
    # Configuration models for the OIDC registry (Settings itself subclasses
    # basic's, which owns the layered resolution).
    "pydantic>=2.11.0",
    "pydantic-settings>=2.16,<3",
    # Outbound HTTP: OIDC discovery, token exchange, userinfo lookups.
    "httpx>=0.28.0",
    # EmailStr on the account schemas.
    "email-validator>=2.1.0",
    # The OAuth 2.1 provider reuses the official MCP SDK's provider base
    # classes, metadata builders and route factories (auth/oauth21.py).
    "mcp>=2.2.0,<3",
]

[project.urls]
Repository = "https://github.com/cliver-project/cliver-playbook"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.4.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The wheel ships this distribution's subtree of the shared
# `cliver_playbook.app` namespace. The `cliver_playbook/` and
# `cliver_playbook/app/` directories deliberately have NO __init__.py
# (PEP 420): every distribution contributes one portion and the import
# system merges them, which is also what lets editable installs of several
# cliver-playbook packages coexist in one virtualenv.
packages = ["src/cliver_playbook"]
# Editable installs (pip install -e) get a plain `_<dist>.pth` file adding
# `src/` to sys.path — the only editable mode that keeps the namespace merge
# working with sibling packages installed the same way. Never set
# dev-mode-exact: it requires __init__.py files and its finder would shadow
# the other packages' namespace portions.
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
# No pythonpath tricks: the tests import the *installed* package, so a broken
# install fails the suite instead of being masked by the source tree.
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework idiom.
ignore = ["B008"]

[tool.ruff.lint.isort]
# `cliver_playbook` is ONE namespace shared by several distributions: pin it
# as first-party in every package, or import grouping would depend on which
# subtree the current distribution happens to own (ruff otherwise classifies
# the sibling packages' modules as third-party).
known-first-party = ["cliver_playbook"]
