[project]
name = "cliver-playbook-app-basic"
version = "0.1.0"
description = "cliver-playbook foundations: layered settings, process runtime, meta + demo Items API, own Alembic chain"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Lin Gao" }]
requires-python = ">=3.12"
dependencies = [
    # Web framework and server
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.35.0",
    # Database: async SQLAlchemy over asyncpg at runtime; psycopg (sync) is the
    # Alembic-only driver. settings.py derives both URLs from one CLIVER_DATABASE_URL.
    "sqlalchemy>=2.0.36",
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "greenlet>=3.1.0",
    # Configuration and validation
    "pydantic>=2.11.0",
    # 2.16 introduced the YamlConfigSettingsSource._read_file seam that
    # config_yaml.py subclasses; the upper bound guards that private API
    # against silent breakage (tests fail loudly if it moves).
    "pydantic-settings>=2.16,<3",
    # Layered config: the app.yaml tier is Jinja2-rendered, then YAML-parsed.
    "jinja2>=3.1",
    "pyyaml>=6.0",
    # Read directly by config_yaml.py for the template env() helper's
    # .env fallback (also a transitive pydantic-settings dependency).
    "python-dotenv>=1.0",
    # HTTP client (outbound calls)
    "httpx>=0.28.0",
]

[project.urls]
Repository = "https://github.com/cliver-project/cliver-playbook"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.4.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The wheel ships this distribution's subtree of the shared
# `cliver_playbook.app` namespace. The `cliver_playbook/` and
# `cliver_playbook/app/` directories deliberately have NO __init__.py
# (PEP 420): every distribution contributes one portion and the import
# system merges them, which is also what lets editable installs of several
# cliver-playbook packages coexist in one virtualenv.
packages = ["src/cliver_playbook"]
# Editable installs (pip install -e) get a plain `_<dist>.pth` file adding
# `src/` to sys.path — the only editable mode that keeps the namespace merge
# working with sibling packages installed the same way. Never set
# dev-mode-exact: it requires __init__.py files and its finder would shadow
# the other packages' namespace portions.
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
# No pythonpath tricks: the tests import the *installed* package, so a broken
# install fails the suite instead of being masked by the source tree.
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework idiom.
ignore = ["B008"]

[tool.ruff.lint.isort]
# `cliver_playbook` is ONE namespace shared by several distributions: pin it
# as first-party in every package, or import grouping would depend on which
# subtree the current distribution happens to own (ruff otherwise classifies
# the sibling packages' modules as third-party).
known-first-party = ["cliver_playbook"]
