name: Release

on:
  push:
    # The release tag is the version itself (for example 0.2.0).
    tags:
      - "[0-9]*"

permissions:
  contents: read

jobs:
  build:
    name: Build every module
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Verify the tag matches every module
        run: python3 scripts/version.py --check --tag "$GITHUB_REF_NAME"

      - name: Build every backend distribution
        run: uv build --all-packages --out-dir dist

      - name: Verify the built artifacts
        run: >-
          python3 scripts/check_release_artifacts.py
          --dist dist --version "$GITHUB_REF_NAME"

      - name: Share the distributions between jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # PyPI identifies a pending trusted publisher by (owner, repository,
  # workflow, environment), so one workflow publishing four projects needs a
  # distinct environment per project. The jobs chain in dependency order.
  publish-basic:
    name: Publish basic
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-basic
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish cliver-playbook-app-basic
        run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          dist/cliver_playbook_app_basic-*

  publish-user:
    name: Publish user
    needs: publish-basic
    runs-on: ubuntu-latest
    environment: pypi-user
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish cliver-playbook-app-user
        run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          dist/cliver_playbook_app_user-*

  publish-rag:
    name: Publish rag
    needs: publish-user
    runs-on: ubuntu-latest
    environment: pypi-rag
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish cliver-playbook-app-rag
        run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          dist/cliver_playbook_app_rag-*

  publish-mcp:
    name: Publish mcp
    needs: publish-rag
    runs-on: ubuntu-latest
    environment: pypi-mcp
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish cliver-playbook-app-mcp
        run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          dist/cliver_playbook_app_mcp-*

  github-release:
    name: Create the GitHub release
    needs: publish-mcp
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes dist/*
